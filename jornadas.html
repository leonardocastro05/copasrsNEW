<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jornadas T39 — Spanish Racing Series</title>
    <link rel="stylesheet" href="css/srs.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>

  <body>
    <div class="ambient" aria-hidden="true"></div>

    <!-- ══ HEADER ══════════════════════════════════════════════ -->
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="index.html">
          <span class="brand-icon">🏁</span>
          <span class="brand-name">SRS <span>T39</span></span>
        </a>
        <nav class="site-nav" aria-label="Principal">
          <a href="index.html">Inicio</a>
          <a href="jornadas.html" class="active">Jornadas</a>
          <a href="eliminatorias.html">Eliminatorias</a>
        </nav>
        <span class="season-badge">COPA VERANO</span>
      </div>
    </header>

    <!-- ══ PAGE HERO ═══════════════════════════════════════════ -->
    <div class="page-hero">
      <div class="container page-hero-inner">
        <div>
          <p class="section-label">// Copa de Verano · Temporada 39</p>
          <h1 class="section-title">Jornadas <em>T39</em></h1>
          <p class="section-sub">
            22 carreras, una por día, sin descansos. Fase 1 (J1-J8) · Fase 2
            (J9-J10) · Fase 3 (J11-J18) · Fase Final (J19-J22).
          </p>
        </div>
        <div
          style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center"
          id="jornadas-chips"
        ></div>
      </div>
    </div>

    <!-- ══ NEXT ROUND COUNTDOWN ════════════════════════════════ -->
    <div class="container" style="position: relative; z-index: 1">
      <div class="next-banner" id="next-banner">
        <div>
          <div class="next-banner-label">⏱ Próxima jornada</div>
          <div class="next-banner-text" id="next-name">—</div>
        </div>
        <span id="next-time" class="next-banner-time">--:--:--</span>
      </div>
    </div>

    <!-- ══ JORNADAS POR FASE ═══════════════════════════════════ -->
    <section class="page-section" style="padding-top: 0" id="jornadas-por-fase">
      <!-- se rellena por JS: un bloque por fase, cada uno con su grid -->
    </section>

    <!-- ══ FOOTER ═══════════════════════════════════════════════ -->
    <footer class="site-footer">
      <div class="container footer-inner">
        <span class="footer-brand"
          >Spanish <span>Racing</span> Series · T39</span
        >
        <div class="footer-links" id="footer-links"></div>
      </div>
    </footer>

    <script src="js/srs-data.js"></script>
    <script src="js/copa.js"></script>
    <script>
      // ── FOOTER ────────────────────────────────────────────────
      document.getElementById("footer-links").innerHTML = SRS.redes
        .map(
          (r) =>
            `<a href="${r.href}" target="_blank" rel="noopener noreferrer">${r.label}</a>`,
        )
        .join("");

      const COPA = window.SRS_COPA || SRS.calcularCopa();

      // ── DEFINICIÓN DE FASES (según reglas T39) ───────────────────
      const FASES = [
        { nombre: "Fase 1 · Clasificación directa", desde: 1, hasta: 8 },
        { nombre: "Fase 2 · Primer corte", desde: 9, hasta: 10 },
        { nombre: "Fase 3 · Última oportunidad", desde: 11, hasta: 18 },
        { nombre: "Fase Final", desde: 19, hasta: 22 },
      ];

      function faseDeJornada(numero) {
        return FASES.find((f) => numero >= f.desde && numero <= f.hasta);
      }

      // Una jornada es visible si es la primera o la anterior ya se completó
      function isVisible(idx) {
        if (idx === 0) return true;
        const prev = SRS.jornadas[idx - 1];
        if (prev && prev.completada === true) return true;
        const actual = SRS.jornadas[idx];
        return actual && actual.completada === true;
      }

      // ── CHIPS ─────────────────────────────────────────────────
      (function () {
        const el = document.getElementById("jornadas-chips");
        SRS.jornadas.forEach((j, i) => {
          const visible = isVisible(i);
          const cls = j.completada ? "chip--done" : "chip--grey";
          const span = document.createElement("span");
          span.className = `chip ${cls}`;
          span.textContent = visible ? `J${j.numero}` : `J${j.numero} 🔒`;
          el.appendChild(span);
        });
      })();

      // ── TARJETA DE UNA JORNADA (14 duelos 1v1 + descanso) ─────
      function renderJornadaCard(j, visible) {
        const card = document.createElement("div");
        card.className = "jornada-card" + (visible ? "" : " hidden-jornada");

        const statusChip = j.completada
          ? `<span class="chip chip--done">Completada</span>`
          : `<span class="chip chip--grey">Pendiente</span>`;

        let bodyHtml;
        if (!visible) {
          bodyHtml = `<div class="jornada-locked">
              <div class="jornada-locked-icon">🔒</div>
              <p>Se revelará tras la jornada anterior</p>
            </div>`;
        } else if (j.enfrentamientos && j.enfrentamientos.length > 0) {
          const descansoHtml = j.descansa
            ? `<div class="duelo-row" style="justify-content:center;opacity:.7;">
                 <span class="duelo-piloto-name">😴 ${j.descansa} descansa esta jornada (+3 pts)</span>
               </div>`
            : "";

          bodyHtml =
            descansoHtml +
            j.enfrentamientos
              .map((d) => {
                const aGano = d.ganador === "A";
                const bGano = d.ganador === "B";
                const sinGanador = !aGano && !bGano;

                if (sinGanador) {
                  return `<div class="duelo-row">
                    <div class="duelo-piloto">
                      <span class="duelo-piloto-avatar">${d.equipoA.charAt(0).toUpperCase()}</span>
                      <span class="duelo-piloto-name">${d.equipoA}</span>
                      ${d.posA != null ? `<span class="duelo-piloto-pos">P${d.posA}</span>` : ""}
                    </div>
                    <span class="duelo-vs-mini">VS</span>
                    <div class="duelo-piloto">
                      <span class="duelo-piloto-avatar">${d.equipoB.charAt(0).toUpperCase()}</span>
                      <span class="duelo-piloto-name">${d.equipoB}</span>
                      ${d.posB != null ? `<span class="duelo-piloto-pos">P${d.posB}</span>` : ""}
                    </div>
                  </div>`;
                }

                const ganador = aGano ? d.equipoA : d.equipoB;
                const perdedor = aGano ? d.equipoB : d.equipoA;
                const posGanador = aGano ? d.posA : d.posB;
                const posPerdedor = aGano ? d.posB : d.posA;

                return `<div class="duelo-row">
                  <div class="duelo-piloto duelo-piloto--win">
                    <span class="duelo-medal">🏆</span>
                    <span class="duelo-piloto-avatar">${ganador.charAt(0).toUpperCase()}</span>
                    <span class="duelo-piloto-name">${ganador}</span>
                    <span class="duelo-piloto-pos">P${posGanador}</span>
                  </div>
                  <span class="duelo-vs-mini">VS</span>
                  <div class="duelo-piloto duelo-piloto--lose">
                    <span class="duelo-piloto-avatar">${perdedor.charAt(0).toUpperCase()}</span>
                    <span class="duelo-piloto-name">${perdedor}</span>
                    <span class="duelo-piloto-pos">P${posPerdedor}</span>
                  </div>
                </div>`;
              })
              .join("");
        } else {
          bodyHtml = `<div class="jornada-locked">
              <div class="jornada-locked-icon">📋</div>
              <p>Emparejamientos pendientes</p>
            </div>`;
        }

        card.innerHTML = `
          <div class="jornada-head">
            <div>
              <div class="jornada-name">Jornada ${j.numero}</div>
              <div class="jornada-date">${j.circuito || ""}</div>
            </div>
            ${statusChip}
          </div>
          <div class="jornada-body">${bodyHtml}</div>`;

        return card;
      }

      // ── RENDER AGRUPADO POR FASE ──────────────────────────────
      (function () {
        const contenedor = document.getElementById("jornadas-por-fase");

        FASES.forEach((fase) => {
          const jornadasFase = SRS.jornadas.filter(
            (j) => j.numero >= fase.desde && j.numero <= fase.hasta,
          );
          if (jornadasFase.length === 0) return;

          const bloque = document.createElement("div");
          bloque.className = "container";
          bloque.style.marginBottom = "40px";

          const completadasFase = jornadasFase.filter(
            (j) => j.completada,
          ).length;

          bloque.innerHTML = `
            <p class="section-label">// ${fase.nombre}</p>
            <h2 class="section-title" style="font-size:1.6rem;">
              J${fase.desde}${fase.desde !== fase.hasta ? "–J" + fase.hasta : ""}
              <em>(${completadasFase}/${jornadasFase.length})</em>
            </h2>
          `;

          const grid = document.createElement("div");
          grid.className = "jornada-grid";

          jornadasFase.forEach((j) => {
            const idxGlobal = SRS.jornadas.findIndex(
              (x) => x.numero === j.numero,
            );
            const visible = isVisible(idxGlobal);
            grid.appendChild(renderJornadaCard(j, visible));
          });

          bloque.appendChild(grid);
          contenedor.appendChild(bloque);
        });
      })();

      // ── PRÓXIMA JORNADA ──────────────────────────────────────────
      (function () {
        const nameEl = document.getElementById("next-name");
        const timeEl = document.getElementById("next-time");
        if (!nameEl) return;

        const siguiente = SRS.jornadas.find((j) => !j.completada);
        if (!siguiente) {
          nameEl.textContent = "Copa finalizada";
          timeEl.textContent = "—";
          return;
        }
        const fase = faseDeJornada(siguiente.numero);
        nameEl.textContent = `J${siguiente.numero} · ${siguiente.circuito || "por confirmar"} (${fase ? fase.nombre : ""})`;
        timeEl.textContent = "por confirmar";
      })();
    </script>
  </body>
</html>
