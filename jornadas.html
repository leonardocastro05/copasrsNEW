<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jornadas · SRS</title>
  <link rel="icon" href="img/banner.webp" type="image/webp" />
  <link rel="stylesheet" href="css/srs.css" />
</head>
<body>
  <div id="header"></div>
  <main>
    <div class="jornada-head">
      <button type="button" id="prev" class="flecha">‹</button>
      <div>
        <p class="sub" id="estado"></p>
        <h1 id="titulo-j"></h1>
      </div>
      <button type="button" id="next" class="flecha">›</button>
    </div>
    <div class="duelos" id="duelos"></div>
    <section class="clasificacion" aria-labelledby="titulo-clasificacion">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Seguimiento</p>
          <h2 class="titulo" id="titulo-clasificacion">Clasificación</h2>
        </div>
        <p class="section-note">Premios acumulados por mánager</p>
      </div>
      <div class="tabla-wrap">
        <table>
          <thead><tr><th>Pos.</th><th>Mánager</th><th>Puntos</th><th>Dinero acumulado</th></tr></thead>
          <tbody id="clasificacion"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="js/srs-data.js"></script>
  <script src="js/perfiles.js"></script>
  <script src="js/web.js"></script>
  <script>
    pintarHeader("jornadas.html");
    var actual = SRS.jornadas.findIndex(function (j) { return !j.completada; });
    if (actual < 0) actual = SRS.jornadas.length - 1;
    var indice = actual;

    function nombreDe(equipo) {
      var p = buscarPorEquipo(equipo);
      return p ? p.nombre : equipo;
    }

    function pintarJornada() {
      var j = SRS.jornadas[indice];
      document.getElementById("titulo-j").innerHTML = (j.nombre || ("Jornada " + j.numero)) +
        (j.circuito ? " · " + j.circuito : "") + (j.fecha ? " · " + j.fecha : "");
      var estado = j.completada ? "Finalizada" : indice === actual ? "Jornada actual" : "Próximamente";
      document.getElementById("estado").innerHTML = estado;
      var html = "";
      j.enfrentamientos.forEach(function (e) {
        var ca = e.ganador === "A" ? "gana" : e.ganador === "B" ? "pierde" : "";
        var cb = e.ganador === "B" ? "gana" : e.ganador === "A" ? "pierde" : "";
        var pa = e.posA ? "P" + e.posA : "";
        var pb = e.posB ? "P" + e.posB : "";
        html += '<div class="duelo">' +
          '<div class="lado ' + ca + '">' + linkManager(nombreDe(e.equipoA)) + "<small>" + e.equipoA + "</small><b>" + pa + "</b></div>" +
          '<div class="vs">VS</div>' +
          '<div class="lado ' + cb + '">' + linkManager(nombreDe(e.equipoB)) + "<small>" + e.equipoB + "</small><b>" + pb + "</b></div>" +
          "</div>";
      });
      if (j.enfrentamientos.length === 0) html = '<p class="vacio">Emparejamientos pendientes</p>';
      document.getElementById("duelos").innerHTML = html;
      var filas = "";
      crearClasificacion().forEach(function (fila, i) {
        filas += "<tr><td>" + (i + 1) + "</td><td>" + linkManager(fila.nombre) +
          "</td><td>" + fila.puntos + "</td><td>" + fila.dinero.toLocaleString("es-ES") + " €</td></tr>";
      });
      document.getElementById("clasificacion").innerHTML = filas;
    }

    document.getElementById("prev").disabled = true;
    document.getElementById("prev").setAttribute("aria-label", "Solo se muestra la jornada actual");
    document.getElementById("prev").addEventListener("click", function () {});
    document.getElementById("next").addEventListener("click", function () {
      var jornada = SRS.jornadas[indice];
      if (!jornada.completada || indice >= SRS.jornadas.length - 1) return;
      indice++;
      actual = indice;
      pintarJornada();
    });
    pintarJornada();
  </script>
</body>
</html>
