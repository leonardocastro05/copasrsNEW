<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jornadas · SRS</title>
  <link rel="icon" href="img/banner.webp" type="image/webp" />
  <link rel="stylesheet" href="css/srs.css" />
</head>
<body>
  <div id="header"></div>
  <main>
    <div class="jornada-head">
      <button type="button" id="prev" class="flecha">‹</button>
      <div>
        <p class="sub" id="estado"></p>
        <h1 id="titulo-j"></h1>
      </div>
      <button type="button" id="next" class="flecha">›</button>
    </div>
    <div class="duelos" id="duelos"></div>
  </main>
  <script src="js/srs-data.js"></script>
  <script src="js/perfiles.js"></script>
  <script src="js/web.js"></script>
  <script>
    pintarHeader("jornadas.html");
    var actual = 0;
    var indice = 0;
    SRS.jornadas.forEach(function (j, i) {
      if (!j.completada && j.enfrentamientos.length > 0 && actual === 0) {
        actual = i;
        indice = i;
      }
    });

    function nombreDe(equipo) {
      var p = buscarPorEquipo(equipo);
      return p ? p.nombre : equipo;
    }

    function pintarJornada() {
      var j = SRS.jornadas[indice];
      document.getElementById("titulo-j").innerHTML = j.nombre || ("Jornada " + j.numero) + (j.circuito ? " · " + j.circuito : "");
      var estado = j.completada ? "Finalizada" : indice === actual ? "Jornada actual" : "Próximamente";
      document.getElementById("estado").innerHTML = estado;
      var html = "";
      j.enfrentamientos.forEach(function (e) {
        var ca = e.ganador === "A" ? "gana" : e.ganador === "B" ? "pierde" : "";
        var cb = e.ganador === "B" ? "gana" : e.ganador === "A" ? "pierde" : "";
        var pa = e.posA ? "P" + e.posA : "";
        var pb = e.posB ? "P" + e.posB : "";
        html += '<div class="duelo">' +
          '<div class="lado ' + ca + '">' + linkManager(nombreDe(e.equipoA)) + "<small>" + e.equipoA + "</small><b>" + pa + "</b></div>" +
          '<div class="vs">VS</div>' +
          '<div class="lado ' + cb + '">' + linkManager(nombreDe(e.equipoB)) + "<small>" + e.equipoB + "</small><b>" + pb + "</b></div>" +
          "</div>";
      });
      if (j.enfrentamientos.length === 0) html = '<p class="vacio">Emparejamientos pendientes</p>';
      document.getElementById("duelos").innerHTML = html;
    }

    document.getElementById("prev").addEventListener("click", function () {
      if (indice > 0) indice--;
      pintarJornada();
    });
    document.getElementById("next").addEventListener("click", function () {
      if (indice < SRS.jornadas.length - 1) indice++;
      pintarJornada();
    });
    pintarJornada();
  </script>
</body>
</html>
