<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eliminatorias · SRS</title>
  <link rel="icon" href="img/banner.webp" type="image/webp" />
  <link rel="stylesheet" href="css/srs.css" />
</head>
<body>
  <div id="header"></div>
  <main class="ancho">
    <div class="section-heading">
      <div>
        <p class="eyebrow">Temporada 42 · doble eliminación</p>
        <h1 class="titulo">Cuadro de <em>eliminatorias</em></h1>
      </div>
      <p class="section-note">La upper bracket conduce a la final. La lower bracket ofrece una segunda oportunidad.</p>
    </div>
    <div id="brackets"></div>
  </main>
  <script src="js/srs-data.js"></script>
  <script src="js/perfiles.js"></script>
  <script src="js/web.js"></script>
  <script>
    pintarHeader("eliminatorias.html");
    function pintarRama(rama, titulo) {
      var html = '<section class="bracket-zone"><div class="bracket-zone-head"><h2>' + titulo + '</h2><span>En curso</span></div><div class="arbol">';
      rama.nombres.forEach(function (nombre, r) {
        var estado = r < BRACKET.ronda ? "off" : "";
        html += '<div class="col ' + estado + '"><h3>' + nombre + "</h3><div class=\"partidos\">";
        for (var i = 0; i < rama.cantidad[r]; i++) {
          var c = rama.cruces[r] && rama.cruces[r][i];
          var a = c ? c[0] : null;
          var b = c ? c[1] : null;
          var g = c ? c[2] : null;
          html += '<div class="match">' +
            '<div class="slot ' + (g === "A" ? "gana" : g === "B" ? "pierde" : "") + '">' + (a ? linkManager(a) : "<em>Por definir</em>") + "</div>" +
            '<div class="slot ' + (g === "B" ? "gana" : g === "A" ? "pierde" : "") + '">' + (b ? linkManager(b) : "<em>Por definir</em>") + "</div></div>";
        }
        html += "</div></div>";
      });
      return html + "</div></section>";
    }

    var final = BRACKET.final;
    var html = pintarRama(BRACKET.upper, "Upper bracket") + pintarRama(BRACKET.lower, "Lower bracket");
    html += '<section class="bracket-final"><h2>Gran final</h2><div class="match final">' +
      '<div class="slot">' + (final[0] === "Por definir" ? "<em>Por definir</em>" : linkManager(final[0])) + "</div>" +
      '<div class="slot">' + (final[1] === "Por definir" ? "<em>Por definir</em>" : linkManager(final[1])) + "</div></div></section>";
    document.getElementById("brackets").innerHTML = html;
  </script>
</body>
</html>
